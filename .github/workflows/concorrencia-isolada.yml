name: Concorrencia PostgreSQL isolada
on:
  push:
    branches: [codex/v16-seguranca-integracoes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concorrencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_DB: trampofacil_concorrencia_test
          POSTGRES_PASSWORD: senha-descartavel-job
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/testar-concorrencia-pg.mjs
        env:
          TRAMPOFACIL_PG_CONCURRENCY_URL: postgres://postgres:senha-descartavel-job@127.0.0.1:5432/trampofacil_concorrencia_test

      - run: node scripts/testar-concorrencia-revisao-pg.mjs
        env:
          TRAMPOFACIL_PG_CONCURRENCY_URL: postgres://postgres:senha-descartavel-job@127.0.0.1:5432/trampofacil_concorrencia_test
