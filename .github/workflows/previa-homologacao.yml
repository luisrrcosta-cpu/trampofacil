name: Preparar previa isolada TrampoFacil
on:
  workflow_dispatch:
  push:
    branches: [codex/v16-seguranca-integracoes]
    paths:
      - '*.html'
      - '*.js'
      - '*.cjs'
      - '.github/workflows/previa-homologacao.yml'
permissions:
  contents: read
jobs:
  previa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validar ambiente exclusivo de homologacao
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const config=fs.readFileSync('config.js','utf8');
          const ambiente=fs.readFileSync('ambiente.js','utf8');
          assert.match(config,/asdszqtpydiowgerxwee\.supabase\.co/);
          assert.match(config,/autenticacaoPronta:\s*false/);
          assert.match(ambiente,/asdszqtpydiowgerxwee/);
          assert.ok(fs.existsSync('index.html'));
          console.log('Previa restrita: autenticacao e pagamentos nao liberados.');
          NODE
      - name: Verificar sintaxe e integridade da interface
        shell: bash
        run: |
          set -eu
          for arquivo in *.js; do
            node --check "$arquivo"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\s+src="([^"]+)"\\s+defer><\\/script>/g)].map(m => m[1]);
          assert.deepEqual(scripts, [
            'config.js','ambiente.js','cadastro.js','valores.js',
            'simulacao.js','sessao.js','servicos.js','conversa.js','simulador.js'
          ], 'A ordem dos scripts foi alterada.');
          for (const arquivo of scripts) assert.ok(fs.existsSync(arquivo), `Script ausente: ${arquivo}`);
          const ids = [...html.matchAll(/\\bid="([^"]+)"/g)].map(m => m[1]);
          assert.equal(new Set(ids).size, ids.length, 'Existem IDs HTML duplicados.');
          const js = scripts.map(arquivo => fs.readFileSync(arquivo, 'utf8')).join('\\n');
          for (const [, id] of js.matchAll(/\\belemento\\('([^']+)'\\)/g)) {
            assert.ok(ids.includes(id), `Elemento HTML ausente: ${id}`);
          }
          assert.match(html, /id="contador-descricao"/);
          assert.match(html, /id="contador-mensagem"/);
          console.log('Sintaxe, scripts e IDs da interface verificados.');
          NODE
      - name: Testar comissoes e parcelamento
        shell: bash
        run: node testes-financeiros.cjs
      - name: Testar isolamento de sessao
        shell: bash
        run: node testes-sessao.cjs
      - name: Testar estados financeiros
        shell: bash
        run: node testes-estados-pagamento.cjs
      - name: Empacotar somente a interface estatica
        shell: bash
        run: |
          mkdir -p previa
          cp index.html *.js previa/
          printf 'PREVIA DE HOMOLOGACAO. Nao publicar sem validar autenticacao, redirect URLs e origem permitida. Pagamentos desativados.\n' > previa/LEIA-ANTES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: trampofacil-previa-homologacao
          path: previa/
          retention-days: 7
