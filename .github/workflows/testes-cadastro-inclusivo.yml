name: Testes de cadastro inclusivo
on:
  push:
    branches:
      - codex/v16-seguranca-integracoes
    paths:
      - 'cadastro.js'
      - 'tests/cadastro-inclusivo.test.js'
      - 'tests/validacao-cadastros.test.js'
      - 'supabase/homologacao/cadastro_inclusivo_prestadores.sql'
      - 'supabase/homologacao/validar_conteudo_cadastros.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/testes-cadastro-inclusivo.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cadastro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias fixadas
        run: npm ci --ignore-scripts
      - name: Validar cadastro e constraints PostgreSQL em banco isolado
        run: node --test tests/cadastro-inclusivo.test.js tests/validacao-cadastros.test.js
